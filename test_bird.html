<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Enemy bird diagnostic</title>
  <style>
    body { background: #1a1a1a; color: #eee; font-family: monospace; padding: 12px; }
    canvas { border: 1px solid #444; display: block; margin: 8px 0; background: #333; }
    pre { background: #000; padding: 8px; overflow-x: auto; }
    h3 { margin: 8px 0 4px; }
  </style>
</head>
<body>
  <h3>Bird at scale 0.5, no animation</h3>
  <canvas id="c1" width="900" height="400"></canvas>

  <h3>Bird at scale 0.19 (the actual game scale)</h3>
  <canvas id="c2" width="900" height="400"></canvas>

  <h3>Bird parts directly — no transform, just drawImage at (0,0)</h3>
  <canvas id="c3" width="900" height="600"></canvas>

  <pre id="log"></pre>

  <script type="module">
    import { AssetLoader } from "/workspace/project/src/assets.js";
    import { EnemyBird } from "/workspace/project/src/enemy_bird.js";

    const log = document.getElementById("log");
    const logLine = (s) => { log.textContent += s + "\n"; console.log(s); };

    const loader = new AssetLoader();
    const parts = await loader.loadSvgParts(
      "/workspace/project/assets/images/enemy_bird.svg",
      ["farWing", "nearWing", "tail", "feet", "body", "head"]
    );

    logLine("=== Parts loaded ===");
    for (const k of Object.keys(parts)) {
      const img = parts[k];
      if (img) {
        logLine(`  ${k}: ${img.naturalWidth}x${img.naturalHeight}  complete=${img.complete}`);
      } else {
        logLine(`  ${k}: NULL`);
      }
    }

    // --- Test 1: big static bird ---
    {
      const ctx = document.getElementById("c1").getContext("2d");
      const bird = new EnemyBird(450, 200, { scale: 0.5, direction: -1, velocityX: 0 });
      bird.setParts(parts);
      bird.update(0.016);
      bird.draw(ctx);
      // marker so we can SEE the bird is where we expect
      ctx.fillStyle = "red";
      ctx.fillRect(448, 198, 4, 4);
    }

    // --- Test 2: game-scale bird ---
    {
      const ctx = document.getElementById("c2").getContext("2d");
      const bird = new EnemyBird(450, 200, { scale: 0.19, direction: -1, velocityX: 0 });
      bird.setParts(parts);
      bird.update(0.016);
      bird.draw(ctx);
      ctx.fillStyle = "red";
      ctx.fillRect(448, 198, 4, 4);
    }

    // --- Test 3: raw parts, no transform ---
    {
      const ctx = document.getElementById("c3").getContext("2d");
      ctx.fillStyle = "white";
      ctx.font = "14px monospace";
      ctx.fillText("Each part drawn raw at its canvas position:", 8, 18);

      let x = 8;
      const order = ["feet", "tail", "farWing", "body", "head", "nearWing"];
      for (const k of order) {
        const img = parts[k];
        if (!img) { logLine(`  skip ${k} (null)`); continue; }
        // draw at 0.4 scale so all fit
        ctx.save();
        ctx.translate(x, 30);
        ctx.scale(0.4, 0.4);
        ctx.drawImage(img, 0, 0);
        ctx.restore();
        ctx.fillStyle = "yellow";
        ctx.fillText(k, x, 270);
        x += 280;
      }
    }

    logLine("=== Done ===");
  </script>
</body>
</html>
